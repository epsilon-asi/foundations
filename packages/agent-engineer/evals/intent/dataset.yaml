# Requests a user might give `agent-engineer do`, each labeled with the intent that should handle it.
# The labels are a first draft: review them before recording the first baseline, since the eval can
# only be as right as they are.
#
#   id       unique; the prefix is the expected intent (aq = answer_question, mc = mini_change, ...)
#   request  what the user typed
#   intent   the intent that should handle it (Intents in src/graphs/router.ts)
#   also     other intents that are as good, for requests that are genuinely ambiguous
#   tags     clear or boundary; a boundary case also names the pair it sits between, as pair:a/b

