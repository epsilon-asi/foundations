# GitHub Actions equivalent of the `validate` stage in .gitlab-ci.yml.
#
# GitLab job                     -> GitHub job
#   validate:packages            -> validate-packages            (node container)
#   validate:automation:packages -> validate-automation-packages (puppeteer container)
#
# Required repository secrets:
#   NPM_TOKEN         - npm registry auth token (all packages)
#
# The GitLab `validate` stage has no rules, so it runs on every push (branches
# and tags) and on merge requests. This mirrors that.

name: Validate

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

env:
  # Mirrors the top-level `variables:` block in .gitlab-ci.yml
  NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
  NPM_PUBLISH_PROVENANCE: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

jobs:
  # ---------------------------------------------------------------------------
  # validate:packages
  # ---------------------------------------------------------------------------
  validate-packages:
    name: "validate:packages (${{ matrix.name }})"
    runs-on: ubuntu-latest
    container:
      image: node:${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the `.packages` anchor, plus the packages added since the
        # GitLab migration (agent-engineer, apps, command-line, evals, sandbox).
        name:
          - agent-engineer
          - type-bridge
          - apps
          - command-line
          - evals
          - foundation
          - langgraph
          - sandbox
          - slack
          - system
          - ui
        # Every package runs on Node 22.17 unless an include below says
        # otherwise. Includes apply in order, and a later include may overwrite
        # a value that an earlier include added (but never an original value).
        include:
          - node: "22.17"
          # sandbox uses Node 24 features and declares engines.node >=24.
          - name: sandbox
            node: "24.15"
          # agent-engineer runs its agents in @epsilon-asi/sandbox, so its
          # tests need what sandbox needs. They also need git, which the
          # node image has.
          - name: agent-engineer
            node: "24.15"
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PACKAGE_DIR: packages/${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require NPM_TOKEN
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN is required."
            exit 1
          fi

      - name: Configure npm auth
        run: npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"

      - name: Install workspace and build dependencies
        uses: ./.github/actions/install-workspace
        with:
          package: ${{ matrix.name }}

      # type-bridge's integration tests compile and run the Python they generate
      # on every supported version, with typing_extensions and pydantic. uv
      # installs standalone CPython builds, which run inside this container.
      - name: Set up Python 3.11-3.14
        if: matrix.name == 'type-bridge'
        shell: bash
        env:
          UV_VERSION: "0.13.8"
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          UV="$HOME/.local/bin/uv"
          for version in 3.11 3.12 3.13 3.14; do
            venv="$RUNNER_TEMP/python-$version"
            "$UV" venv --python "$version" "$venv"
            "$UV" pip install --python "$venv/bin/python" typing_extensions pydantic
            "$venv/bin/python$version" -I -c "import sys, pydantic; print(sys.version, 'pydantic', pydantic.VERSION)"
            echo "$venv/bin" >> "$GITHUB_PATH"
          done

      # The example imports the public apps entry during typechecking and Vitest.
      - name: Build apps and check the browser and Node entries
        if: matrix.name == 'apps'
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          npm run check:browser
          npm run test:import
          # The package uses TS 7. Repeat the type checks with the root TS 5.9.
          node ../../node_modules/typescript/bin/tsc -p tsconfig.type-tests.json
          node ../../node_modules/typescript/bin/tsc -p tsconfig.browser.json

      # Builds compile src only and Vitest transpiles runtime test files.
      - name: Typecheck and verify type-test discovery
        working-directory: ${{ env.PACKAGE_DIR }}
        run: bash ../../scripts/testing/check-type-tests.sh

      - name: Typecheck command-line on TypeScript 5.9
        if: matrix.name == 'command-line'
        working-directory: ${{ env.PACKAGE_DIR }}
        run: node ../../node_modules/typescript/bin/tsc -p tsconfig.json --noEmit

      - name: Test
        working-directory: ${{ env.PACKAGE_DIR }}
        # Makes type-bridge fail, rather than skip, if an interpreter is missing.
        env:
          TYPE_BRIDGE_REQUIRE_PYTHON: ${{ matrix.name == 'type-bridge' && '1' || '' }}
        run: npm test

      - name: Build
        if: matrix.name != 'apps'
        working-directory: ${{ env.PACKAGE_DIR }}
        run: corepack pnpm run build

      - name: Check the foundation browser entry
        if: matrix.name == 'foundation'
        working-directory: ${{ env.PACKAGE_DIR }}
        run: corepack pnpm run check:browser

      - name: Load the packed system package from ESM and CommonJS
        if: matrix.name == 'system'
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm run test:package

      - name: Install the TypeScript 5.9 and 7 consumer fixture
        if: matrix.name == 'foundation' || matrix.name == 'langgraph' || matrix.name == 'system'
        working-directory: testing/foundation-consumer
        run: npm ci --install-links

      - name: Typecheck system on TypeScript 7
        if: matrix.name == 'system'
        working-directory: testing/foundation-consumer
        run: node node_modules/typescript7/bin/tsc -p ../../packages/system/tsconfig.type-tests.json --noEmit

      - name: Typecheck langgraph on TypeScript 5.9 and 7
        if: matrix.name == 'langgraph'
        working-directory: testing/foundation-consumer
        run: |
          node node_modules/typescript/bin/tsc -p ../../packages/langgraph/tsconfig.json --noEmit
          node node_modules/typescript7/bin/tsc -p ../../packages/langgraph/tsconfig.json --noEmit

      - name: Check foundation and consume tarballs built by TypeScript 5.9 and 7
        if: matrix.name == 'foundation'
        working-directory: testing/foundation-consumer
        run: |
          node node_modules/typescript7/bin/tsc -p ../../packages/foundation/tsconfig.type-tests.json
          node node_modules/typescript7/bin/tsc -p ../../packages/foundation/tsconfig.browser.json
          npm run test:builds

      # Mirrors `artifacts: when: always, expire_in: 7 days`
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-${{ matrix.name }}
          path: |
            packages/*/coverage/
            packages/*/build/
            packages/*/dist/
          retention-days: 7
          if-no-files-found: ignore

  validate-apps-postgres:
    name: "validate:apps PostgreSQL"
    runs-on: ubuntu-latest
    container: node:24.15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: foundations_test
          POSTGRES_PASSWORD: local_test
        options: >-
          --health-cmd "pg_isready -U postgres -d foundations_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
      - name: Install workspace and build dependencies
        uses: ./.github/actions/install-workspace
        with:
          package: apps
      - name: Build and run PostgreSQL acceptance tests
        working-directory: packages/apps
        env:
          SPIKE_POSTGRES_URL: postgresql://postgres:local_test@postgres:5432/foundations_test
          SPIKE_REQUIRE_POSTGRES: "1"
        run: |
          corepack pnpm run build
          corepack pnpm exec vitest run tests/e2e/postgresOfferingHttp.test.ts tests/spikes/orm/orm.test.ts

  # ---------------------------------------------------------------------------
  # validate:automation:packages
  # ---------------------------------------------------------------------------
  validate-automation-packages:
    name: "validate:automation:packages (${{ matrix.name }})"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/puppeteer/puppeteer:24.43.1
      # The puppeteer image defaults to the non-root `pptruser`, which cannot
      # write to the runner-mounted workspace on GitHub Actions. Running as root
      # is the standard workaround for container jobs. If tests launch Chrome
      # directly, they may need `--no-sandbox` when running as root.
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the `.automation_packages` anchor
        name:
          - actors
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PACKAGE_DIR: packages/${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require NPM_TOKEN
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN is required."
            exit 1
          fi

      - name: Configure npm auth
        run: npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"

      - name: Install workspace and build dependencies
        uses: ./.github/actions/install-workspace
        with:
          package: ${{ matrix.name }}

      - name: Typecheck and verify type-test discovery
        working-directory: ${{ env.PACKAGE_DIR }}
        run: bash ../../scripts/testing/check-type-tests.sh

      - name: Test
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm test

      - name: Build
        working-directory: ${{ env.PACKAGE_DIR }}
        run: corepack pnpm run build

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-${{ matrix.name }}
          path: |
            packages/*/coverage/
            packages/*/build/
            packages/*/dist/
          retention-days: 7
          if-no-files-found: ignore
