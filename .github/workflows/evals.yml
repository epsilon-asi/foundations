# Runs agent-engineer's evals on real models, by hand: Actions -> Evals -> Run workflow.
#
# Evals measure how well the agents do their jobs and cost money, so they never run on push. Each run
# adds its summary to this run's page and keeps eval-results/ as an artifact. A run fails when a score
# breaks its threshold or drops below its committed baseline by more than noise.
#
# Required repository secrets:
#   OPENAI_API_KEY    - the models under test
#   NPM_TOKEN         - npm registry auth token, as in validate.yml

name: Evals

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Eval suite to run (a file name filter under packages/agent-engineer/evals)"
        required: true
        default: "intent"
      intent_model:
        description: "OpenAI model for the intent suite (empty: the default)"
        required: false
        default: ""
      trials:
        description: "Runs of each case"
        required: true
        default: "1"
      filter:
        description: "Only cases whose id contains this, or with this tag (empty: all)"
        required: false
        default: ""

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"

jobs:
  eval:
    name: "eval (${{ inputs.suite }})"
    runs-on: ubuntu-latest
    container:
      image: node:24.15
    timeout-minutes: 120
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    defaults:
      run:
        working-directory: packages/agent-engineer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require secrets
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::The OPENAI_API_KEY repository secret is required to run evals."
            exit 1
          fi

      - name: Configure npm auth
        if: env.NPM_TOKEN != ''
        run: npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"

      - name: Install dependencies
        run: npm ci

      - name: Run evals
        env:
          EVAL_TRIALS: ${{ inputs.trials }}
          EVAL_INTENT_MODEL: ${{ inputs.intent_model }}
          EVAL_FILTER: ${{ inputs.filter }}
          SUITE: ${{ inputs.suite }}
        run: npm run eval -- "$SUITE"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ inputs.suite }}
          path: packages/agent-engineer/eval-results/
          retention-days: 30
          if-no-files-found: ignore
